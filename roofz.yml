name: Roofz checker

on:
  schedule:
    - cron: "7 * * * *"   # ieder uur, 7 minuten over
  workflow_dispatch:        # handmatig starten via de Actions-tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeer Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Check roofz.eu
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python roofz_checker.py

      - name: Sla gezien-lijst op
        run: |
          git config user.name "roofz-bot"
          git config user.email "roofz-bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "Update gezien-lijst"
          git push
